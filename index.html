<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Card Challenge</title>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div id="app">

        <!-- ================================ -->
        <!-- 遊戲標題 -->
        <!-- ================================ -->

        <h1>🎮 AI Card Challenge</h1>

        <p class="subtitle">
            玩家創造挑戰，玩家挑戰遊戲
        </p>


        <!-- ================================ -->
        <!-- 主選單 -->
        <!-- ================================ -->

        <div id="menu">

            <button id="createRoom">
                🏠 建立房間
            </button>


            <div class="join-area">

                <input
                    id="roomCode"
                    type="text"
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="輸入4碼房號"
                >

                <button id="joinRoom">
                    🔗 加入房間
                </button>

            </div>

        </div>


        <!-- ================================ -->
        <!-- 房間畫面 -->
        <!-- ================================ -->

        <div
            id="roomScreen"
            class="hidden"
        >

            <h2>🏠 遊戲房間</h2>


            <!-- 房號 -->

            <div class="room-code-title">
                房間號
            </div>


            <div id="displayRoomCode">
                ----
            </div>


            <!-- 房間狀態 -->

            <p id="roomStatus">
                ⏳ 正在建立房間...
            </p>


            <!-- ============================ -->
            <!-- 玩家列表 -->
            <!-- ============================ -->

            <div id="playerList">

                <div id="player1">
                    👤 玩家 1：房主
                </div>


                <div id="player2">
                    ⏳ 玩家 2：等待加入...
                </div>

            </div>


            <!-- 離開房間 -->

            <button id="leaveRoom">
                🚪 離開房間
            </button>

        </div>


        <!-- ================================ -->
        <!-- 系統訊息 -->
        <!-- ================================ -->

        <div id="message"></div>

    </div>


    <!-- ================================ -->
    <!-- JavaScript -->
    <!-- ================================ -->

    <!-- 必須先載入 room.js -->
    <script src="room.js"></script>

    <!-- 再載入 game.js -->
    <script src="game.js"></script>

</body>

</html>
